<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="img/icone.png">
    <title>FluentGO</title>
</head>

<body>
    <div class="caixa-maior">
        <textarea class="input-texto"></textarea>

        <div class="controle">
            <select class="idioma">
                <option value="pt"> Português</option>
                <option value="en"> Inglês</option>
                <option value="de"> Alemão</option>
                <option value="ja"> Japonês</option>
                <option value="fr"> Francês</option>
                <option value="zh"> Mandarin</option>
                <option value="es"> Espanhol</option>
                <option value="hi"> Hindi</option>
                <option value="ru"> Russo</option>
            </select>

            <button class="botao" onclick="traduzir()">
                <img src="img/traduzir.svg">
            </button>

            <button class="botao" onclick="usarMicrofone()">
                <img src="img/microfone.svg" alt="">
            </button>

        </div>

        <div class="resultado">
            <h3 class="titulo-traducao">Tradução</h3>
            <p class="traducao">A tradução aparecerá aqui...</p>
        </div>

    </div>
    
</body>
<script src="scripts.js"></script>
</html>
